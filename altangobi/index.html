<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Өсөх Зоос Алтанговь · AR урилга 2027</title>
<style>
  :root{--gold:#e9c46a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#050403;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #ar{position:fixed;inset:0}
  #ar video{object-fit:cover}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;z-index:10}
  .hidden{display:none!important}
  #start{background:radial-gradient(90% 60% at 50% 30%,#2a2113,#120e08 55%,#050403)}
  #start img{width:180px;margin-bottom:14px;filter:drop-shadow(0 0 18px rgba(240,196,99,.35))}
  .co{font-size:12px;letter-spacing:5px;color:#d9b25c;margin-bottom:6px}
  h1{font-size:46px;margin:0 0 4px;background:linear-gradient(180deg,#fff0bf,#f0c463 45%,#b07a22);-webkit-background-clip:text;color:transparent}
  p{margin:6px 0;line-height:1.5;color:#e9dcbc;max-width:340px}
  .guest{font-size:22px;color:#fff;font-weight:700;margin:4px 0 8px}
  .btn{display:inline-block;margin-top:16px;padding:16px 28px;border-radius:40px;border:0;font-size:18px;font-weight:700;
       background:linear-gradient(180deg,#ffe8a3,#c9973a);color:#1a1200;text-decoration:none;cursor:pointer;min-width:240px}
  .btn.ghost{background:transparent;color:var(--gold);border:2px solid var(--gold);font-weight:600}
  #hint{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;display:flex;justify-content:center;padding-bottom:40px}
  #frame{position:fixed;top:50%;left:50%;width:58vw;max-width:300px;aspect-ratio:1240/1748;transform:translate(-50%,-55%);
         border:3px dashed rgba(233,196,106,.85);border-radius:10px;z-index:5;pointer-events:none;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .pill{background:rgba(5,4,3,.75);padding:12px 20px;border-radius:30px;font-size:16px}
  #cta{position:fixed;left:0;right:0;bottom:34px;z-index:6;display:flex;justify-content:center}
  #spinner{width:42px;height:42px;border:4px solid rgba(233,196,106,.25);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:18px auto 0}
  @keyframes spin{to{transform:rotate(360deg)}}
  #flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,236,170,.95),rgba(255,200,90,.35) 35%,transparent 65%);opacity:0;transition:opacity .5s}
  #view3d{position:fixed;inset:0;z-index:1}
  #backbar{position:fixed;top:14px;left:14px;z-index:6}
  #backbar button{background:rgba(5,4,3,.7);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:8px 14px;font-size:14px}
</style>
<script type="importmap">
{ "imports": { "three": "../lib/three.module.js", "three/addons/": "../lib/addons/" } }
</script>
</head>
<body>

<div id="start" class="screen">
  <img src="logo.svg" alt="">
  <div class="co">ӨСӨХ ЗООС АЛТАНГОВЬ ХХК</div>
  <h1>2027</h1>
  <div class="guest" id="guestName">Саруулбилэг танаа</div>
  <p>Камераа нээгээд <b>урилгын карт</b> руугаа чиглүүлээрэй.</p>
  <button id="btnStart" class="btn">📷 3D-ээр харах</button>
  <a class="btn ghost" id="lnkInvite1" href="#">Урилгаа шууд нээх</a>
</div>

<div id="loading" class="screen hidden" style="background:#050403"><p>Камер асааж байна…</p><div id="spinner"></div></div>

<div id="fail" class="screen hidden" style="background:#050403">
  <h1 style="font-size:30px">Камер нээгдсэнгүй</h1>
  <p id="failMsg">Камерын зөвшөөрөл өгөөгүй эсвэл энэ утас AR дэмжихгүй байна.</p>
  <button id="btnNoCam" class="btn">✨ 3D-г камергүй харах</button>
  <a class="btn ghost" id="lnkInvite2" href="#">Урилгаа нээх</a>
  <button id="btnRetry" class="btn ghost" style="border:0;font-size:15px;text-decoration:underline">Дахин оролдох</button>
</div>

<div id="ar"></div>
<div id="flash"></div>
<div id="frame" class="hidden"></div>
<div id="hint" class="hidden"><div class="pill">Картаа хүрээнд багтаан барина уу</div></div>
<div id="cta" class="hidden"><a class="btn" id="lnkInvite3" href="#">💌 Урилгаа нээх</a></div>
<div id="view3d" class="hidden"></div>
<div id="backbar" class="hidden"><button id="btnBack">← Буцах</button> <button onclick="window.__replay&&window.__replay()">↻ Дахин</button></div>

<script type="module">
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ===== ТОХИРГОО ===== */
const CONFIG = {
  inviteUrl: '../invite.html',      // "Алтан шөнө" цахим урилгын холбоос
  target: './targets.mind',
  // Картан дээрх логоны байрлал (px, карт 1240×1748): төв (620,500), өргөн 500
  logo: { cx: 620, cy: 500, w: 500 },
};
const qs = new URLSearchParams(location.search);
if (qs.get('u')) CONFIG.inviteUrl = qs.get('u');
if (qs.get('n')) document.getElementById('guestName').textContent = qs.get('n') + ' танаа';
['lnkInvite1','lnkInvite2','lnkInvite3'].forEach(id => document.getElementById(id).href = CONFIG.inviteUrl);

const $ = id => document.getElementById(id);
const show = (id, on=true) => $(id).classList.toggle('hidden', !on);
const px2u = { x: v => (v - 620) / 1240, y: v => (874 - v) / 1240, s: v => v / 1240 };

/* ===== AR агуулга: 3D лого + дараалан гарч ирэх бичгүүд ===== */
const svgP = new SVGLoader().loadAsync('./logo.svg');
const layersP = fetch('./layers/layers.json').then(r => r.json());
const texLoader = new THREE.TextureLoader();

// Цаг хуваарь (секунд, карт танигдсанаас хойш)
const TIMELINE = { veil: 0, logo: .2, company: 1.3, title: 2.1, year: 2.8, dear: 3.6, name: 4.1, text: 5.1, date: 6.1, place: 6.6, cta: 7.3 };
// Бичиг бүр хэдэн секундэд урсаж бичигдэх
const DUR = { company: 1.0, title: .9, year: .9, dear: .7, name: 1.2, text: 1.2, date: .8, place: .8 };
// Бичиг бүрийн хөөрөх өндөр (картын өргөнтэй харьцуулсан) ба зузаан (давхаргын тоо)
const DEPTH = { company: [.04, 1], title: [.05, 1], year: [.08, 9], dear: [.04, 1], name: [.07, 6], text: [.035, 1], date: [.05, 3], place: [.04, 1] };

const ease = x => 1 - Math.pow(1 - THREE.MathUtils.clamp(x, 0, 1), 3);
const easeBack = x => { x = THREE.MathUtils.clamp(x, 0, 1); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

async function buildContent(isAR) {
  const [data, layers] = await Promise.all([svgP, layersP]);
  const root = new THREE.Group();
  const anims = [];   // {start, apply(p, t)}

  // 0) Картыг бага зэрэг бараанруулах "хөшиг" — голограм тод харагдана
  const veil = new THREE.Mesh(new THREE.PlaneGeometry(1, 1748 / 1240),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0, depthWrite: false }));
  veil.position.z = .001; root.add(veil);
  anims.push({ start: TIMELINE.veil, dur: .6, apply: p => veil.material.opacity = p * .8 });

  // 1) 3D лого — хэвлэсэн логоноос 1.3 дахин том, тогтвортой хөвнө
  const vb = data.xml.getAttribute('viewBox').split(/\s+/).map(Number);
  const shapes = data.paths.flatMap(p => SVGLoader.createShapes(p));
  const geo = new THREE.ExtrudeGeometry(shapes, { depth: 80, curveSegments: 10,
    bevelEnabled: true, bevelThickness: 10, bevelSize: 5, bevelSegments: 3 });
  geo.translate(-vb[2] / 2, -vb[3] / 2, -40);
  const face = new THREE.MeshStandardMaterial({ color: 0xf5cf6a, metalness: .9, roughness: .25, emissive: 0x3a2805 });
  const side = new THREE.MeshStandardMaterial({ color: 0xb07a22, metalness: .95, roughness: .35, emissive: 0x1c1203 });
  const logo = new THREE.Mesh(geo, [face, side]);
  const k = px2u.s(CONFIG.logo.w * 1.3) / vb[2];
  logo.scale.set(k, -k, k);
  const logoG = new THREE.Group(); logoG.add(logo);
  const LX = px2u.x(CONFIG.logo.cx), LY = px2u.y(CONFIG.logo.cy) + .02;
  logoG.position.set(LX, LY, 0); root.add(logoG);
  anims.push({ start: TIMELINE.logo, dur: 1.1, apply: (p, t, a) => {
    const e = easeBack(p);
    logoG.scale.setScalar(Math.max(.0001, .5 + .5 * e));
    logoG.position.z = .02 + e * .1;
    logoG.rotation.x = 0;                                           // босоо, тэгш
    logoG.rotation.y = Math.sin((t - TIMELINE.logo) * .8) * .7 * ease(p);   // баруун, зүүн тийш зөөлөн эргэнэ (±40°)
    logoG.visible = p > 0;
    face.emissiveIntensity = 1 + Math.max(0, 1 - (a - TIMELINE.logo) * 1.2) * 3;
  }});

  // Гэрэлтэх туяа логоны ард
  const dot = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    const gr = g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,240,190,1)'); gr.addColorStop(.35,'rgba(240,196,99,.8)'); gr.addColorStop(1,'rgba(240,196,99,0)');
    g.fillStyle = gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })();
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: dot, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 }));
  glow.scale.set(.95, .8, 1); glow.position.set(LX, LY, .1); root.add(glow);
  anims.push({ start: TIMELINE.logo, dur: 1, apply: (p, t) => glow.material.opacity = p * (.45 + Math.sin(t * 2) * .08) });

  // Тэлэх цагираг
  const ring = new THREE.Mesh(new THREE.RingGeometry(.2, .214, 96), new THREE.MeshBasicMaterial({ color: 0xffd98a, transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
  ring.position.set(LX, LY, .005); root.add(ring);
  anims.push({ start: TIMELINE.logo, dur: 1.4, apply: p => { ring.material.opacity = p > 0 && p < 1 ? .9 * (1 - p) : 0; ring.scale.setScalar(1 + p * 1.8); } });

  // 2) Бичгүүд — зүүнээс баруун тийш алтан гэрэл гүйж "урсаж" бичигдэнэ
  for (const L of layers) {
    const tex = await texLoader.loadAsync(`./layers/${L.k}.png`);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
    const [h, n] = DEPTH[L.k];
    const g = new THREE.Group();
    const w = px2u.s(L.w), hh = px2u.s(L.h);
    const reveal = { value: 0 };                       // 0 → 1: бичигдэж буй хувь
    for (let i = 0; i < n; i++) {                       // давхаргаар зузаан (3D)
      const front = i === n - 1;
      const m = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false,
        color: front ? 0xffffff : new THREE.Color().setHSL(.11, .7, .18 + .22 * i / Math.max(1, n - 1)) });
      m.onBeforeCompile = sh => {
        sh.uniforms.uReveal = reveal;
        sh.fragmentShader = 'uniform float uReveal;\n' + sh.fragmentShader.replace('#include <map_fragment>', `#include <map_fragment>
          float edge = uReveal * 1.2 - vMapUv.x;
          float shown = smoothstep(0.0, 0.06, edge);
          float spark = exp(-pow((edge - 0.03) / 0.035, 2.0)) * step(uReveal, 0.999);
          diffuseColor.rgb += vec3(1.0, 0.86, 0.5) * spark * 1.6;
          diffuseColor.a *= max(shown, spark * diffuseColor.a);`);
      };
      const pl = new THREE.Mesh(new THREE.PlaneGeometry(w, hh), m);
      pl.position.z = n > 1 ? (i / (n - 1) - 1) * .018 : 0;
      pl.renderOrder = 10 + i; g.add(pl);
    }
    // Бичих "үзүүр" — гүйж буй алтан гэрэл
    const pen = new THREE.Sprite(new THREE.SpriteMaterial({ map: dot, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 }));
    pen.scale.set(hh * 1.1, hh * 1.1, 1); pen.position.z = .006; g.add(pen);
    g.position.set(px2u.x(L.cx), px2u.y(L.cy), 0);
    root.add(g);
    const st = TIMELINE[L.k], dur = DUR[L.k];
    anims.push({ start: st, dur, apply: (p, t) => {
      g.visible = p > 0;
      reveal.value = p;
      const e = ease(Math.min(1, p * 1.3));
      g.position.z = .005 + e * h + (p >= 1 ? Math.sin(t * 1.4 + st) * .004 : 0);
      const x = Math.min(1, p * 1.2);
      pen.position.x = -w / 2 + x * w;
      pen.material.opacity = p > 0 && p < .83 ? .9 : 0;
    }});
  }

  // 3) Алтан тоосонцор
  const N = 200, pos = new Float32Array(N * 3), spd = new Float32Array(N);
  const reset = i => { pos[i*3] = (Math.random() - .5) * .95; pos[i*3+1] = (Math.random() - .5) * 1.35; pos[i*3+2] = Math.random() * .02; };
  for (let i = 0; i < N; i++) { reset(i); pos[i*3+2] = Math.random() * .4; spd[i] = .03 + Math.random() * .08; }
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const dust = new THREE.Points(pg, new THREE.PointsMaterial({ size: .016, map: dot, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 }));
  root.add(dust);

  let t0 = -1;
  function restart() { t0 = -1; }
  function update(t, dt, visible) {
    root.visible = visible;
    if (!visible) return;
    if (t0 < 0) t0 = t;
    const a = t - t0;
    for (const an of anims) an.apply(THREE.MathUtils.clamp((a - an.start) / an.dur, 0, 1), t, a);
    dust.material.opacity = Math.min(1, a);
    const p = pg.attributes.position.array;
    for (let i = 0; i < N; i++) { p[i*3+2] += spd[i] * dt; if (p[i*3+2] > .4) reset(i); }
    pg.attributes.position.needsUpdate = true;
    if (a > TIMELINE.cta) onCTA?.();
  }
  let onCTA = null;
  return { root, update, restart, set onCTA(f) { onCTA = f; } };
}

function addEnv(renderer, scene) {
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  const d = new THREE.DirectionalLight(0xffffff, 1.8); d.position.set(.3, 1, 1.2); scene.add(d);
  scene.add(new THREE.HemisphereLight(0xfff1d0, 0x2a1f0d, 1.0));
}

/* ===== AR ===== */
let mindar = null;
async function startAR() {
  show('start', false); show('fail', false); show('loading');
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('nocam');
    const { MindARThree } = await import('../lib/mindar-image-three.prod.js');
    mindar = new MindARThree({ container: $('ar'), imageTargetSrc: CONFIG.target,
      uiLoading: 'no', uiScanning: 'no', uiError: 'no',
      filterMinCF: 0.0001, filterBeta: 0.001, missTolerance: 15, warmupTolerance: 3 });
    const { renderer, scene, camera } = mindar;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    addEnv(renderer, scene);
    const c = await buildContent(true);
    const anchor = mindar.addAnchor(0);
    anchor.group.add(c.root);

    let found = false, lostAt = 0;
    c.onCTA = () => show('cta');
    anchor.onTargetFound = () => { found = true; show('hint', false); show('frame', false);
      if (performance.now() - lostAt > 2500) {           // удаан алдсан бол дахин эхнээс нь тоглуулна
        c.restart(); $('flash').style.opacity = 1; setTimeout(() => $('flash').style.opacity = 0, 180); navigator.vibrate?.(40); }
    };
    anchor.onTargetLost = () => { found = false; lostAt = performance.now(); show('hint'); show('frame'); };

    await mindar.start();
    show('loading', false); show('hint'); show('frame');
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), .05);
      c.update(clock.elapsedTime, dt, found); renderer.render(scene, camera); });
    window.__ar = { get found() { return found; } };
  } catch (err) {
    console.error(err);
    try { mindar?.stop(); } catch (_) {}
    show('loading', false); show('hint', false); show('frame', false);
    $('failMsg').textContent = err?.name === 'NotAllowedError'
      ? 'Камерын зөвшөөрөл олгоогүй байна. Хөтчийн тохиргооноос зөвшөөрөөд дахин оролдоно уу.'
      : 'Камер нээгдсэнгүй эсвэл энэ утас AR дэмжихгүй байна.';
    show('fail');
  }
}

/* ===== Камергүй 3D ===== */
let viewer = null;
async function startNoCam() {
  show('fail', false); show('start', false); show('view3d'); show('backbar');
  if (viewer) return;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  $('view3d').appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0805);
  addEnv(renderer, scene);
  const c = await buildContent(false);
  c.onCTA = () => show('cta');
  window.__replay = () => c.restart();
  // Картыг ширээн дээр хэвтүүлж, дээр нь голограмыг харуулна
  const table = new THREE.Group(); table.rotation.x = -Math.PI / 2; scene.add(table);
  const cardTex = await new THREE.TextureLoader().loadAsync('./card.png'); cardTex.colorSpace = THREE.SRGBColorSpace;
  table.add(new THREE.Mesh(new THREE.PlaneGeometry(1, 1748 / 1240), new THREE.MeshBasicMaterial({ map: cardTex })));
  table.add(c.root);
  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .01, 50);
  camera.position.set(0, 1.7, 1.9);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, .05, -.05); controls.enableDamping = true; controls.enablePan = false;
  controls.minDistance = .6; controls.maxDistance = 3;
  addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), .05); c.update(clock.elapsedTime, dt, true); controls.update(); renderer.render(scene, camera); });
  viewer = renderer;
}

$('btnStart').onclick = startAR;
$('btnRetry').onclick = () => location.reload();
$('btnNoCam').onclick = startNoCam;
$('btnBack').onclick = () => location.reload();
if (qs.get('auto') === '1') startAR();
</script>
</body>
</html>
